name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add Hostinger to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Sync files to Hostinger
        run: |
          rsync -avz --exclude='.git' \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/public_html/wp-content/plugins/828ers/

      - name: Run SQL files via WP-CLI
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            WP_PATH=~/public_html
            PLUGIN_SQL_DIR=\$WP_PATH/wp-content/plugins/828ers/sql
            if ls \$PLUGIN_SQL_DIR/*.sql 1> /dev/null 2>&1; then
              for f in \$PLUGIN_SQL_DIR/*.sql; do
                echo \"Executing \$f...\"
                wp db query < \"\$f\" --path=\$WP_PATH
              done
            else
              echo 'No SQL files found. Skipping.'
            fi
          "

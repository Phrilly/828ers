name: Mirror to GitLab

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - run: git clone --bare https://github.com/Phrilly/828ers.git .
      - run: git push --mirror https://oauth2:${{ secrets.GIT_LAB_TOKEN }}@gitlab.com/phrilly-group/828ers.git
